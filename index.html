<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validación de permiso</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f4f1ea; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:22px; }
  .card { background:#fff; border-radius:16px; max-width:620px; width:100%; padding:26px;
          box-shadow:0 10px 34px rgba(70,45,20,.13); }
  .logo { display:block; margin:0 auto 12px; width:210px; max-width:75%; }
  h1 { font-size:14.5px; text-align:center; letter-spacing:.5px; color:#7a2e1e; margin:0 0 3px;
       text-transform:uppercase; }
  .sub { text-align:center; color:#7d7268; font-size:12px; margin-bottom:16px; }
  .ok { display:flex; gap:8px; align-items:center; justify-content:center; background:#e9f6ec;
        color:#1b5e20; font-weight:700; padding:9px; border-radius:10px; margin-bottom:16px; font-size:13.5px; }
  .err { background:#fdecea; color:#b3261e; padding:10px; border-radius:10px; font-size:13.5px; text-align:center; }
  .fila { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #f0ece4; font-size:13.5px; }
  .fila:last-of-type { border-bottom:0; }
  .et { width:45%; color:#8a6a55; }
  .va { flex:1; color:#241f1b; font-weight:600; word-break:break-word; }
  .pie { margin-top:16px; font-size:10.5px; color:#a59a8e; text-align:center; line-height:1.5;
         border-top:1px solid #f0ece4; padding-top:10px; }
  .cargando { text-align:center; color:#8a6a55; padding:20px 0; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logosmex/Oaxaca.png" alt="Gobierno del Estado de Oaxaca"
       onerror="this.style.display='none'">
  <h1>Permiso provisional para circular</h1>
  <div class="sub">sin placas y tarjetas de circulación · servicios particulares</div>
  <div id="contenido"><div class="cargando">Consultando el permiso…</div></div>
  <div class="pie" id="pie"></div>
</div>
<script>
(function () {
  var CAMPOS = [
    ["propietario", "Propietario"],
    ["rfc", "RFC"],
    ["fecha_expedicion", "Fecha de expedición"],
    ["vigencia", "Vigencia del permiso"],
    ["marca", "Marca"],
    ["modelo", "Modelo"],
    ["anio", "Año/Modelo"],
    ["color", "Color"],
    ["serie", "N° de serie"],
    ["motor", "N° de motor"],
    ["placas", "Placas"]
  ];
  var cont = document.getElementById("contenido");
  var pie = document.getElementById("pie");

  function err(msg) {
    cont.innerHTML = '<div class="err">' + msg + "</div>";
  }
  function fecha(v) {
    if (!v) return "";
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
    return m ? (m[3] + "/" + m[2] + "/" + m[1]) : v;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var id = new URLSearchParams(location.search).get("id");
  if (!id) { err("Falta el folio del permiso en el enlace."); return; }
  if (!/^[A-Za-z0-9._-]+$/.test(id)) { err("Folio inválido."); return; }

  fetch(id + "/datos.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("No encontrado"); return r.json(); })
    .then(function (d) {
      var html = '<div class="ok">✓ Permiso válido · datos verificados en línea</div>';
      CAMPOS.forEach(function (c) {
        var v = d[c[0]];
        if (c[0] === "fecha_expedicion" || c[0] === "vigencia") v = fecha(v);
        if (v == null || String(v).trim() === "") return;
        html += '<div class="fila"><span class="et">' + esc(c[1]) + '</span>' +
                '<span class="va">' + esc(v) + "</span></div>";
      });
      cont.innerHTML = html;
      pie.innerHTML = "Folio " + esc(d.folio || id) +
        "<br>Consulta generada automáticamente. Los datos mostrados son los registrados al emitir el permiso.";
    })
    .catch(function () {
      err("No se encontró información para el folio <b>" + esc(id) + "</b>.<br>" +
          "Verifica el enlace o el código QR.");
    });
})();
</script>
</body>
</html>
